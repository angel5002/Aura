<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA · K002</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; }
  #marco { position: relative; width: 100vw; height: calc(100vw * 9 / 16); max-height: 100vh;
           max-width: calc(100vh * 16 / 9); margin: 0 auto; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="marco"><canvas id="gl" width="1920" height="1080"></canvas><canvas id="hud" width="1920" height="1080"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Módulos de ejemplo de la MISMA versión (three 0.128.0 = r128), cargados en el navegador; no se instala nada -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/BokehPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="datos_k002.js"></script>
<script>
"use strict";
// Escena ilustrativa de K002. Señal, estado y cruces detectados: DATOS REALES (datos_k002.js, generado por
// analisis/escena_k002.py). Figura humana: PROTOCOLO de la prueba (no sale del WiFi; AURA no la localiza).
// Modelo de la figura: "Animated Human" de Quaternius, CC0 (poly.pizza/m/c3Ibh9I3udk), en modelos/.
const D = window.DATOS_K002;
const W = 1920, H = 1080;
const P = new URLSearchParams(location.search);
const T_FIJO = P.has("t") ? parseFloat(P.get("t")) : null;
const CAMARA = P.get("cam") || "principal";
const AZ = P.has("az") ? parseFloat(P.get("az")) : null;  // azimut de la órbita en grados (el video lo pasa por cuadro)
const EXPORTAR = P.get("exportar");                 // nombre del PNG a guardar (servidor local)
let VELOCIDAD = parseFloat(P.get("vel") || "1");    // solo informativo en el HUD (el video lo fija por cuadro)
const ROTULO = "Señal y detección: datos reales de K002. La figura sigue el protocolo de la prueba; " +
               "AURA no capta la forma ni la postura del cuerpo.";

// ---------- datos reales ----------
function idx(t) {                                 // última muestra con t_i <= t
  let a = 0, b = D.t.length - 1;
  if (t < D.t[0]) return 0;
  while (a < b) { const m = (a + b + 1) >> 1; if (D.t[m] <= t) a = m; else b = m - 1; }
  return a;
}
function tasaCSI(t) {                             // media de los últimos 3 s completos
  const s = Math.floor(t); let n = 0, k = 0;
  for (let i = Math.max(0, s - 3); i < s; i++) { if (i < D.tasa_csi.length) { n += D.tasa_csi[i]; k++; } }
  return k ? n / k : 0;
}
function detectados(t) { return D.primer_positivo.filter(p => p !== null && p <= t).length; }

// ---------- protocolo (figura) ----------
const PUNTO1_Z = 0.80, VUELTA_Z = -0.20, PASO_X = 0.0;          // marcas frente a la mitad de la línea
const SALIDA = -0.5, LLEGADA = 0.9, GIRO_FIN = 1.3, REGRESO = 2.5;  // s respecto del horario (~3 s ida y vuelta)
const GIRO = 0.4;                                                // s para volver a mirar la línea en el Punto 1
const PESO_MAX = 0.85;                                           // la caminata se mezcla un poco con Idle (braceo suave)
const rampa = (x) => Math.max(0, Math.min(1, x));
function persona(t) {
  // rumbo: 0 = mira hacia la cámara (+z); PI = mira hacia la línea (-z). w = peso de la animación Walk
  for (const tc of D.cruces) {
    const s = t - tc;
    if (s >= SALIDA && s < LLEGADA)                              // ida hasta la marca de vuelta
      return { z: PUNTO1_Z + (s - SALIDA) / (LLEGADA - SALIDA) * (VUELTA_Z - PUNTO1_Z), camina: s - SALIDA, rumbo: Math.PI,
               w: PESO_MAX * rampa(Math.min((s - SALIDA) / 0.25, (LLEGADA - s) / 0.2 + 0.3)) };
    if (s >= LLEGADA && s < GIRO_FIN)                            // se da la vuelta en el sitio
      return { z: VUELTA_Z, camina: s - SALIDA, rumbo: Math.PI * (1 - (s - LLEGADA) / (GIRO_FIN - LLEGADA)),
               w: 0.3 * rampa(1 - (s - LLEGADA) / 0.15) };
    if (s >= GIRO_FIN && s < REGRESO)                            // vuelta al Punto 1
      return { z: VUELTA_Z + (s - GIRO_FIN) / (REGRESO - GIRO_FIN) * (PUNTO1_Z - VUELTA_Z), camina: s - SALIDA, rumbo: 0,
               w: PESO_MAX * rampa(Math.min((s - GIRO_FIN) / 0.2 + 0.3, (REGRESO - s) / 0.2 + 0.3)) };
    if (s >= REGRESO && s < REGRESO + GIRO)                      // en el Punto 1: vuelve a mirar la línea
      return { z: PUNTO1_Z, camina: null, rumbo: Math.PI * (s - REGRESO) / GIRO, w: 0 };
  }
  return { z: PUNTO1_Z, camina: null, rumbo: Math.PI, w: 0 };
}

// ---------- escena ----------
const gl = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x04060b, 1);
const escena = new THREE.Scene();
escena.fog = new THREE.FogExp2(0x04060b, 0.075);                 // niebla exponencial oscura
const camara = new THREE.PerspectiveCamera(36, W / H, 0.1, 40);
// Cámara alta, desde el frente (lado del Punto 1), inclinada hacia abajo; órbita lenta = azimut
const VISTAS = {
  principal: { dist: 8.2, incl: 42, az: -16, mira: new THREE.Vector3(0, 0.45, 0.2) },
  general:   { dist: 10.5, incl: 48, az: 24, mira: new THREE.Vector3(0, 0.55, -0.45) },
};
const vista = VISTAS[CAMARA] || VISTAS.principal;
function ponerCamara(azGrados) {
  const a = THREE.MathUtils.degToRad(azGrados), e = THREE.MathUtils.degToRad(vista.incl);
  camara.position.set(vista.mira.x + vista.dist * Math.cos(e) * Math.sin(a), vista.mira.y + vista.dist * Math.sin(e),
                      vista.mira.z + vista.dist * Math.cos(e) * Math.cos(a));
  camara.lookAt(vista.mira);
  camara.updateMatrixWorld();
}
ponerCamara(AZ !== null ? AZ : vista.az);
escena.add(new THREE.HemisphereLight(0x6f8cff, 0x04060b, 0.6));
const luz = new THREE.DirectionalLight(0xffffff, 0.5); luz.position.set(2, 4, 3); escena.add(luz);

const HUAWEI = new THREE.Vector3(-1, 1, 0), PLACA = new THREE.Vector3(1, 1, 0);  // ~2 m (aprox., sin medir)

// Piso de baldosas (0,2 m). Se iluminan SOLO las de la línea Huawei–B (|z| <= 0,3; -1 <= x <= 1), según la señal.
const LADO = 0.2, NX = 40, NZ = 34;
const geoBaldosa = new THREE.BoxGeometry(LADO * 0.82, 0.01, LADO * 0.82);
const matBaldosa = new THREE.MeshBasicMaterial({ color: 0xffffff });
const baldosas = new THREE.InstancedMesh(geoBaldosa, matBaldosa, NX * NZ);
const enLinea = [];
const tmp = new THREE.Object3D();
let n = 0;
for (let i = 0; i < NX; i++) for (let k = 0; k < NZ; k++) {
  const x = (i - (NX - 1) / 2) * LADO, z = (k - (NZ - 1) / 2) * LADO - 0.6;
  tmp.position.set(x, 0, z); tmp.updateMatrix(); baldosas.setMatrixAt(n, tmp.matrix);
  enLinea.push(Math.abs(z) <= 0.3 && x >= -1.0 && x <= 1.0);
  baldosas.setColorAt(n, new THREE.Color(0x0b1a16));
  n++;
}
escena.add(baldosas);

// Emisor (Huawei), placa B y celular
function equipo(pos, color, tam, conPie = true) {
  const g = new THREE.Group();
  const caja = new THREE.Mesh(new THREE.BoxGeometry(tam[0], tam[1], tam[2]),
                              new THREE.MeshStandardMaterial({ color: 0x141922, emissive: color, emissiveIntensity: 0.12 }));
  const bordes = new THREE.LineSegments(new THREE.EdgesGeometry(caja.geometry), new THREE.LineBasicMaterial({ color }));
  const pie = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, pos.y - tam[1] / 2, 8),
                             new THREE.MeshBasicMaterial({ color: 0x23324a }));
  pie.position.set(0, -pos.y / 2, 0);
  g.add(caja, bordes); if (conPie) g.add(pie); g.position.copy(pos); escena.add(g);
  return g;
}
equipo(HUAWEI, 0x4f7dff, [0.22, 0.16, 0.16]);
equipo(PLACA, 0x2fe08a, [0.10, 0.04, 0.06]);
const CELULAR = new THREE.Vector3(0.45, 1.0, -1.15);
equipo(CELULAR, 0xd9a441, [0.08, 0.012, 0.16], false);              // celular sobre la cama (sin pie)
const cama = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 1.1), new THREE.MeshStandardMaterial({ color: 0x10151f }));
cama.position.set(0.3, 0.25, -1.75); escena.add(cama);
escena.add(new THREE.LineSegments(new THREE.EdgesGeometry(cama.geometry), new THREE.LineBasicMaterial({ color: 0x2a3550 })).translateX(0.3).translateY(0.25).translateZ(-1.75));

// Enlace (haz tenue entre los dos equipos)
const haz = new THREE.Line(new THREE.BufferGeometry().setFromPoints([HUAWEI, PLACA]),
                           new THREE.LineDashedMaterial({ color: 0x6fa8ff, dashSize: 0.06, gapSize: 0.04, transparent: true, opacity: 0.6 }));
haz.computeLineDistances(); escena.add(haz);

// Cúpulas de malla concéntricas desde el Huawei (metáfora de la onda; no son datos: "ondas: ilustrativas")
const geoCupula = new THREE.SphereGeometry(1, 28, 9, 0, Math.PI * 2, 0, Math.PI / 2);
const cupulas = [];
for (let i = 0; i < 3; i++) {
  const m = new THREE.Mesh(geoCupula, new THREE.MeshBasicMaterial({ color: 0x5a86ff, wireframe: true, transparent: true, opacity: 0.5, fog: false }));
  m.position.copy(HUAWEI); m.position.y = 0.0; escena.add(m); cupulas.push(m);
}

// ---------- figura holograma (modelo CC0 de Quaternius; sin esqueleto ni articulaciones a la vista) ----------
// Material Fresnel: borde más brillante que el centro. Mezcla NORMAL (no aditiva) y brillo que se apaga hacia
// los pies, para que la figura no aclare las baldosas (regla: nada se ilumina bajo la persona).
const matHolo = new THREE.ShaderMaterial({
  skinning: true, transparent: true, depthWrite: false, side: THREE.FrontSide,
  uniforms: { color: { value: new THREE.Color(0x3dffc0) }, opacidad: { value: 0.6 } },
  vertexShader: `
    #include <common>
    #include <skinning_pars_vertex>
    attribute float aCabeza;                               // 1 = vértice de la cabeza del modelo (ojos, pelo): se oculta
    varying vec3 vN; varying vec3 vV; varying float vY; varying float vCab;
    void main() {
      vCab = aCabeza;
      #include <skinbase_vertex>
      #include <beginnormal_vertex>
      #include <skinnormal_vertex>
      #include <defaultnormal_vertex>
      #include <begin_vertex>
      #include <skinning_vertex>
      #include <project_vertex>
      vN = normalize(transformedNormal); vV = normalize(-mvPosition.xyz);
      vY = (modelMatrix * vec4(transformed, 1.0)).y;
    }`,
  fragmentShader: `
    uniform vec3 color; uniform float opacidad;
    varying vec3 vN; varying vec3 vV; varying float vY; varying float vCab;
    void main() {
      if (vCab > 0.5) discard;
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.4);
      float pies = smoothstep(0.02, 0.3, vY);              // apaga el brillo cerca del piso
      vec3 c = color * (0.22 + 1.4 * f) * (0.35 + 0.65 * pies);
      gl_FragColor = vec4(c, opacidad * (0.05 + 0.7 * f) * (0.4 + 0.6 * pies));
    }`,
});
const figura = new THREE.Group();
escena.add(figura);
let mezclador = null, accCaminar = null, accQuieto = null;
const RITMO = 1.25;                                    // velocidad de la caminata (pasos acordes a ~0,7 m/s)

// Halo suave alrededor de la figura y estela tenue al caminar (sprites; mezcla normal; se desvanecen antes del piso)
function texturaHalo() {
  const cv = document.createElement("canvas"); cv.width = 64; cv.height = 128;
  const x = cv.getContext("2d"); x.translate(32, 64); x.scale(1, 2);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, 32);
  g.addColorStop(0, "rgba(255,255,255,0.9)"); g.addColorStop(0.5, "rgba(255,255,255,0.3)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(-32, -32, 64, 64);
  return new THREE.CanvasTexture(cv);
}
const texHalo = texturaHalo();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: texHalo, color: 0x2fffc8, transparent: true, opacity: 0.16, depthWrite: false }));
halo.scale.set(1.0, 1.9, 1); halo.position.y = 1.1;
const estela = [];
for (let k = 1; k <= 5; k++) {
  const e = new THREE.Sprite(new THREE.SpriteMaterial({ map: texHalo, color: 0x2fffc8, transparent: true, opacity: 0, depthWrite: false }));
  e.scale.set(0.6, 1.7, 1); e.position.y = 1.0; escena.add(e); estela.push(e);
}
// Círculo suave en el piso bajo los pies (marca de posición de la figura ilustrativa; no es detección)
function texturaCirculo() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const x = cv.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(3,8,12,0.75)"); g.addColorStop(0.72, "rgba(3,8,12,0.55)");
  g.addColorStop(0.86, "rgba(140,255,220,0.2)"); g.addColorStop(1, "rgba(140,255,220,0)");
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}
const circuloPies = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7),
  new THREE.MeshBasicMaterial({ map: texturaCirculo(), transparent: true, depthWrite: false }));
circuloPies.rotation.x = -Math.PI / 2; circuloPies.position.y = 0.009; circuloPies.renderOrder = 1;
// Marcas del protocolo en el suelo: Punto 1 (0,80 m) y marca de vuelta (0,20 m del otro lado)
const matMarca = new THREE.MeshBasicMaterial({ color: 0xaab6cc, transparent: true, opacity: 0.5, depthWrite: false });
const marcaP1 = new THREE.Mesh(new THREE.RingGeometry(0.17, 0.195, 40), matMarca);
marcaP1.rotation.x = -Math.PI / 2; marcaP1.position.set(PASO_X, 0.008, PUNTO1_Z); escena.add(marcaP1);
for (const [ancho, largo] of [[0.5, 0.025], [0.025, 0.5]]) {
  const cruz = new THREE.Mesh(new THREE.PlaneGeometry(ancho, largo), matMarca);
  cruz.rotation.x = -Math.PI / 2; cruz.position.set(PASO_X, 0.008, PUNTO1_Z); escena.add(cruz);
}
const marcaVuelta = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.03), matMarca);
marcaVuelta.rotation.x = -Math.PI / 2; marcaVuelta.position.set(PASO_X, 0.008, VUELTA_Z); escena.add(marcaVuelta);
for (const dx of [-0.3, 0.3]) {
  const tope = new THREE.Mesh(new THREE.PlaneGeometry(0.03, 0.14), matMarca);
  tope.rotation.x = -Math.PI / 2; tope.position.set(PASO_X + dx, 0.008, VUELTA_Z); escena.add(tope);
}

// Partículas suaves alrededor de la figura (se mueven con ella; quedan por encima de 0,35 m)
function texturaPunto() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 64;
  const x = cv.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.4, "rgba(255,255,255,0.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
const NP = 220, semillas = [];
const geoPart = new THREE.BufferGeometry();
geoPart.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NP * 3), 3));
let sem = 7; const azar = () => (sem = (sem * 16807) % 2147483647) / 2147483647;   // reproducible
for (let i = 0; i < NP; i++) semillas.push({ a: azar() * Math.PI * 2, r: 0.22 + azar() * 0.3, y: azar(), v: 0.08 + azar() * 0.12, f: azar() });
const particulas = new THREE.Points(geoPart, new THREE.PointsMaterial({
  color: 0x7dffd8, size: 0.035, map: texturaPunto(), transparent: true, opacity: 0.55, depthWrite: false }));
figura.add(particulas, halo, circuloPies);
function moverParticulas(t) {
  const pos = geoPart.attributes.position.array;
  semillas.forEach((s, i) => {
    const h = (s.y + t * s.v) % 1;
    const a = s.a + t * 0.25 * (s.f - 0.5);
    pos[i * 3] = Math.cos(a) * s.r; pos[i * 3 + 1] = 0.35 + h * 1.5; pos[i * 3 + 2] = Math.sin(a) * s.r;
  });
  geoPart.attributes.position.needsUpdate = true;
}

const cargaFigura = new Promise((ok, mal) => {
  new THREE.GLTFLoader().load("modelos/quaternius_animated_human.glb", g => {
    const modelo = g.scene;
    modelo.traverse(o => { if (o.isMesh) { o.material = matHolo; o.frustumCulled = false; } });
    modelo.updateMatrixWorld(true);
    const caja = new THREE.Box3().setFromObject(modelo), tam = caja.getSize(new THREE.Vector3());
    modelo.scale.multiplyScalar(1.70 / tam.y);                     // 1,70 m de alto (ilustrativo)
    modelo.position.y = -caja.min.y * 1.70 / tam.y;
    figura.add(modelo);
    modelo.updateMatrixWorld(true);
    let malla = null; modelo.traverse(o => { if (o.isSkinnedMesh) malla = o; });
    const huesos = malla.skeleton.bones, cabeza = huesos.find(b => b.name === "Head");
    const deCabeza = new Set(); cabeza.traverse(b => deCabeza.add(huesos.indexOf(b)));
    const geo = malla.geometry, si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
    const aCab = new Float32Array(si.count), caja3 = new THREE.Box3(), v = new THREE.Vector3();
    for (let i = 0; i < si.count; i++) {
      let p = 0;
      for (const c of ["getX", "getY", "getZ", "getW"]) if (deCabeza.has(si[c](i))) p += sw[c](i);   // r128: sin getComponent
      aCab[i] = p;
      if (p > 0.5) { v.fromBufferAttribute(geo.attributes.position, i); malla.boneTransform(i, v); caja3.expandByPoint(v.applyMatrix4(malla.matrixWorld)); }
    }
    geo.setAttribute("aCabeza", new THREE.BufferAttribute(aCab, 1));
    const centro = caja3.getCenter(new THREE.Vector3()), tamCab = caja3.getSize(new THREE.Vector3());
    const escCab = cabeza.getWorldScale(new THREE.Vector3()).x;
    const matCab = matHolo.clone(); matCab.skinning = false; matCab.uniforms = matHolo.uniforms;
    const bola = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), matCab);
    const d = Math.min(tamCab.x, tamCab.z) * 0.95;               // diámetro sin el volumen del pelo
    bola.scale.set(d / escCab, d * 1.18 / escCab, d / escCab);
    bola.position.copy(cabeza.worldToLocal(centro.clone().add(new THREE.Vector3(0, -0.02, 0))));
    cabeza.add(bola);
    window.__cabeza = { centro: centro.toArray(), tam: tamCab.toArray(), d };
    mezclador = new THREE.AnimationMixer(modelo);
    const clip = nombre => g.animations.find(a => a.name.endsWith("|" + nombre));
    accCaminar = mezclador.clipAction(clip("Walk")); accQuieto = mezclador.clipAction(clip("Idle"));
    accCaminar.play(); accQuieto.play();
    ok();
  }, undefined, mal);
});

// ---------- posprocesado: profundidad de campo, bloom y viñeta ----------
const compositor = new THREE.EffectComposer(renderer);
compositor.setPixelRatio(1); compositor.setSize(W, H);
compositor.addPass(new THREE.RenderPass(escena, camara));
const bokeh = new THREE.BokehPass(escena, camara, { focus: 6.0, aperture: 0.0022, maxblur: 0.006, width: W, height: H });
bokeh.materialDepth.skinning = true;
const renderBokeh = bokeh.render.bind(bokeh);
bokeh.render = function (...a) {                     // la malla de las cúpulas y las partículas no cuentan para el foco
  const ocultos = [...cupulas, particulas, haz]; ocultos.forEach(o => o.visible = false);
  renderBokeh(...a); ocultos.forEach(o => o.visible = true);
};
compositor.addPass(bokeh);
compositor.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.55, 0.18));
const vineta = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, fuerza: { value: 1.15 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform float fuerza; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = (vUv - 0.5) * vec2(1.0, 0.75);
      gl_FragColor = vec4(c.rgb * clamp(1.0 - fuerza * dot(d, d) * 1.6, 0.0, 1.0), 1.0); }`,
});
compositor.addPass(vineta);

// ---------- HUD (todo dibujado en el lienzo, para exportar en 1080p) ----------
const hud = document.getElementById("hud"), c = hud.getContext("2d");
function panel(x, y, w, h, titulo) {
  c.save();
  c.beginPath(); c.roundRect(x, y, w, h, 16);
  c.fillStyle = "rgba(9,16,28,0.74)"; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = "rgba(120,170,255,0.28)"; c.stroke();
  if (titulo) { c.fillStyle = "#7f93b8"; c.font = "600 17px 'Segoe UI', sans-serif"; c.fillText(titulo.toUpperCase(), x + 22, y + 34); }
  c.restore();
}
function texto(s, x, y, tam, color, peso = 400, alin = "left") {
  c.font = `${peso} ${tam}px 'Segoe UI', sans-serif`; c.fillStyle = color; c.textAlign = alin; c.fillText(s, x, y); c.textAlign = "left";
}
function pantalla(v) { const q = v.clone().project(camara); return { x: (q.x + 1) / 2 * W, y: (1 - q.y) / 2 * H }; }
function cajaFigura() {                            // rectángulo de la figura en pantalla (para no taparla con rótulos)
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const dx of [-0.35, 0.35]) for (const dz of [-0.35, 0.35]) for (const y of [0, 1.95]) {
    const p = pantalla(new THREE.Vector3(figura.position.x + dx, y, figura.position.z + dz));
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  return { x0, x1, y0, y1 };
}
function dibujarHUD(t) {
  c.clearRect(0, 0, W, H);
  const i = idx(t), mov = D.mov[i] === 1, nDet = detectados(t);
  // Título propio
  texto("AURA", 48, 86, 64, "#e8f0ff", 700);
  texto("sensado WiFi del movimiento · prueba de cruces", 52, 120, 21, "#7f93b8");
  // Sello de reproducción (en vez de "en vivo")
  c.beginPath(); c.roundRect(W - 560, 44, 512, 52, 26); c.fillStyle = "rgba(60,38,8,0.75)"; c.fill();
  c.strokeStyle = "rgba(255,170,60,0.6)"; c.lineWidth = 1.5; c.stroke();
  c.beginPath(); c.arc(W - 530, 70, 8, 0, Math.PI * 2); c.fillStyle = "#ffae3c"; c.fill();
  texto("REPRODUCCIÓN · K002 (27/10/2026)", W - 510, 79, 22, "#ffd29a", 600);
  texto(`t = ${t.toFixed(1)} s de la prueba · ${VELOCIDAD === 1 ? "tiempo real ×1" : "acelerado ×" + VELOCIDAD}`,
        W - 48, 128, 20, VELOCIDAD === 1 ? "#8fe3a8" : "#ffbe73", 500, "right");
  // Panel "Módulos"
  panel(40, 160, 400, 236, "Módulos");
  const filas = [["Movimiento", "activo", true], ["Respiración", "en investigación", false], ["Presencia quieta", "en investigación", false]];
  filas.forEach(([nom, est, act], k) => {
    const y = 236 + k * 58;
    c.beginPath(); c.arc(68, y - 8, 9, 0, Math.PI * 2);
    c.fillStyle = act ? (mov ? "#ff4d4d" : "#3fe08f") : "#4a5263"; c.fill();
    texto(nom, 92, y, 25, act ? "#e8f0ff" : "#6b7385", act ? 600 : 400);
    texto(est, 420, y, 19, act ? "#8fe3a8" : "#6b7385", 400, "right");
  });
  // Rótulos proyectados sin superponerse: equipos, figura y celular (este nunca sobre la figura)
  const fig = cajaFigura(), ocupados = [];
  const MARGEN = 8;
  const choca = r => ocupados.some(o => r.x0 < o.x1 + MARGEN && r.x1 > o.x0 - MARGEN && r.y0 < o.y1 + MARGEN && r.y1 > o.y0 - MARGEN)
                     || r.x0 < 30 || r.x1 > W - 30 || r.y0 < 140 || r.y1 > 735 || (r.x0 < 450 && r.y0 < 405);
  const caja = (s, x, y, tam, peso, alin) => {
    c.font = `${peso} ${tam}px 'Segoe UI', sans-serif`; const w = c.measureText(s).width;
    const x0 = alin === "center" ? x - w / 2 : alin === "right" ? x - w : x;
    return { x0, x1: x0 + w, y0: y - tam, y1: y + 5 };
  };
  for (const [v, nom, col] of [[HUAWEI, "Huawei (router)", "#8fb0ff"], [PLACA, "placa B", "#5ff0a8"]]) {
    const q = pantalla(v.clone().add(new THREE.Vector3(0, 0.2, 0)));
    texto(nom, q.x, q.y, 19, col, 500, "center"); ocupados.push(caja(nom, q.x, q.y, 19, 500, "center"));
  }
  const cel = pantalla(CELULAR);
  ocupados.push({ x0: cel.x - 16, x1: cel.x + 16, y0: cel.y - 12, y1: cel.y + 12 });
  // Marcas del protocolo: nombre a un costado de cada marca (derecha o izquierda), sin tapar la figura
  for (const [z, nom] of [[PUNTO1_Z, "Punto 1 (0,80 m)"], [VUELTA_Z, "marca de vuelta (0,20 m)"]]) {
    for (const [dx, a] of [[0.42, "left"], [-0.42, "right"], [0.75, "left"], [-0.75, "right"]]) {
      const q = pantalla(new THREE.Vector3(PASO_X + dx, 0, z)), r = caja(nom, q.x, q.y + 6, 16, 500, a);
      const sobreFig = r.x0 < fig.x1 && r.x1 > fig.x0 && r.y0 < fig.y1 && r.y1 > fig.y0;
      if (choca(r) || sobreFig) continue;
      c.font = "500 16px 'Segoe UI', sans-serif"; c.textAlign = a; c.lineWidth = 4; c.strokeStyle = "rgba(4,6,11,0.85)";
      c.strokeText(nom, q.x, q.y + 6); c.textAlign = "left";
      texto(nom, q.x, q.y + 6, 16, "#c3cde0", 500, a); ocupados.push(r); break;
    }
  }
  // Celular primero: rótulo con línea guía en el primer lugar libre; ni el rótulo ni la guía tocan la figura
  const cajaFig = { x0: fig.x0, x1: fig.x1, y0: fig.y0, y1: fig.y1 };
  ocupados.push(cajaFig);
  const ROT_CEL = "celular (receptor)";
  c.font = "500 19px 'Segoe UI', sans-serif";
  const anchoCel = c.measureText(ROT_CEL).width;
  const opcCel = [];
  for (const dy of [-50, -90, -130, -170, 40, 80]) for (const dx of [120, 220, 340, 460, -120 - anchoCel, -240 - anchoCel, -360 - anchoCel]) opcCel.push([dx, dy]);
  const finGuia = (x, y) => [x > cel.x ? x - 6 : x + anchoCel + 6, y - 6];
  const puntosGuia = (x, y) => {
    const [gx, gy] = finGuia(x, y), pts = [];
    for (let k = 1; k < 24; k++) {
      const px = cel.x + (gx - cel.x) * k / 24, py = cel.y + (gy - cel.y) * k / 24;
      if (Math.hypot(px - cel.x, py - cel.y) >= 22) pts.push([px, py]);
    }
    return pts;
  };
  const cruza = (x, y) => puntosGuia(x, y).some(([px, py]) => ocupados.some(o => px > o.x0 - 4 && px < o.x1 + 4 && py > o.y0 - 4 && py < o.y1 + 4));
  // 1) sin tocar nada; 2) si no hay lugar (p. ej., el celular queda detrás de la figura), el rótulo igual fuera
  //    de la figura (regla) y de la zona de paneles; la línea guía puede pasar por detrás de la figura.
  // Se conserva la posición del cuadro anterior mientras siga siendo válida (el rótulo no salta en el video).
  const solapaFig = (r) => r.x0 < fig.x1 + MARGEN && r.x1 > fig.x0 - MARGEN && r.y0 < fig.y1 + MARGEN && r.y1 > fig.y0 - MARGEN;
  const estricta = ([dx, dy]) => { const x = cel.x + dx, y = cel.y + dy; return !choca(caja(ROT_CEL, x, y, 19, 500, "left")) && !cruza(x, y); };
  const minima = ([dx, dy]) => { const x = cel.x + dx, y = cel.y + dy, r = caja(ROT_CEL, x, y, 19, 500, "left");
    return !solapaFig(r) && r.x0 > 30 && r.x1 < W - 30 && r.y0 > 140 && r.y1 < 735 && !(r.x0 < 450 && r.y0 < 405); };
  const previa = window.__celPrev;
  const libreCel = (previa && estricta(previa)) ? previa : opcCel.find(estricta)
                 || ((previa && minima(previa)) ? previa : opcCel.find(minima));
  window.__celPrev = libreCel || null;
  const [lx, ly] = libreCel ? [cel.x + libreCel[0], cel.y + libreCel[1]] : [cel.x + opcCel[0][0], cel.y + opcCel[0][1]];
  window.__rotulos = { celularSinLugar: !libreCel, solapaFigura: (() => { const r = caja(ROT_CEL, lx, ly, 19, 500, "left");
    return r.x0 < fig.x1 && r.x1 > fig.x0 && r.y0 < fig.y1 && r.y1 > fig.y0; })() };   // para comprobar el video
  c.strokeStyle = "rgba(232,192,112,0.55)"; c.lineWidth = 1.2; c.beginPath();
  c.moveTo(cel.x, cel.y - 4); c.lineTo(...finGuia(lx, ly)); c.stroke();
  texto(ROT_CEL, lx, ly, 19, "#e8c070", 500);
  ocupados.splice(ocupados.indexOf(cajaFig), 1);  // el rótulo de la figura sí va pegado a ella
  ocupados.push(caja(ROT_CEL, lx, ly, 19, 500, "left"));
  for (const [px, py] of puntosGuia(lx, ly)) ocupados.push({ x0: px - 2, x1: px + 2, y0: py - 2, y1: py + 2 });
  // Figura: sobre la cabeza; si choca, a un lado de la cabeza o más arriba (con guía corta)
  const ROT_FIG = "figura ilustrativa según el protocolo", COL_FIG = "rgba(150,255,210,0.85)";
  const pc = pantalla(new THREE.Vector3(figura.position.x, 1.95, figura.position.z));
  const opcFig = [[pc.x, pc.y - 6, "center"], [fig.x0 - 12, pc.y + 30, "right"], [fig.x1 + 12, pc.y + 30, "left"],
                  [pc.x, pc.y - 44, "center"], [fig.x0 - 12, pc.y + 70, "right"], [fig.x1 + 12, pc.y + 70, "left"],
                  [fig.x0 - 12, pc.y - 20, "right"], [fig.x1 + 12, pc.y - 20, "left"]];
  const elegida = opcFig.find(([x, y, a]) => !choca(caja(ROT_FIG, x, y, 18, 400, a))) || opcFig[1];
  if (elegida[2] !== "center") {
    c.strokeStyle = "rgba(150,255,210,0.45)"; c.lineWidth = 1.2; c.beginPath();
    const cab = pantalla(new THREE.Vector3(figura.position.x, 1.55, figura.position.z));   // a la altura de la cabeza
    c.moveTo(elegida[0] + (elegida[2] === "right" ? 6 : -6), elegida[1] - 6); c.lineTo(cab.x + (elegida[2] === "right" ? -28 : 28), cab.y); c.stroke();
  }
  texto(ROT_FIG, elegida[0], elegida[1], 18, COL_FIG, 400, elegida[2]);
  // Leyenda pequeña
  texto("ondas: ilustrativas · esquema, no a escala · Huawei–placa B: ~2 m (aprox., sin medir)", W - 48, 750, 16, "#6f7e9c", 400, "right");
  // Panel "Señal WiFi" (datos reales)
  const px = 40, py = 770, pw = W - 80, ph = 220;
  panel(px, py, pw, ph, "Señal WiFi · datos reales de K002");
  texto(mov ? "MOVIMIENTO" : "quieto", px + 24, py + 102, 54, mov ? "#ff5a5a" : "#6fa8ff", 700);
  texto(`cruces detectados: ${nDet}/10`, px + 26, py + 150, 28, "#e8f0ff", 500);
  texto(`tasa de CSI: ${Math.round(tasaCSI(t))} /s`, px + 26, py + 190, 22, "#9fb0cf", 400);
  // Señal del detector desplazándose (últimos 20 s)
  const gx = px + 470, gy = py + 52, gw = pw - 500, gh = ph - 80, VENT = 20;
  c.save(); c.beginPath(); c.rect(gx, gy, gw, gh); c.clip();
  c.fillStyle = "rgba(255,255,255,0.03)"; c.fillRect(gx, gy, gw, gh);
  const t0 = t - VENT; let maxv = 0;
  const i0 = idx(t0), i1 = idx(t);
  for (let k = i0; k <= i1; k++) maxv = Math.max(maxv, D.suave[k], D.entrada[k]);
  maxv = Math.max(maxv * 1.1, 2.0);
  const X = tt => gx + (tt - t0) / VENT * gw, Y = v => gy + gh - v / maxv * gh;
  for (let k = i0; k < i1; k++) if (D.mov[k]) { c.fillStyle = "rgba(255,70,70,0.30)"; c.fillRect(X(D.t[k]), gy, Math.max(1, X(D.t[k + 1]) - X(D.t[k])), gh); }
  for (const tc of D.cruces) if (tc >= t0 && tc <= t) {
    c.strokeStyle = "rgba(200,210,230,0.45)"; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(X(tc), gy); c.lineTo(X(tc), gy + gh); c.stroke(); c.setLineDash([]);
    const cerca = X(tc) > gx + gw - 80;
    texto(`cruce ${D.cruces.indexOf(tc) + 1}`, X(tc) + (cerca ? -6 : 6), gy + 20, 16, "#aab6cc", 400, cerca ? "right" : "left");
  }
  c.strokeStyle = "#ff8080"; c.setLineDash([8, 6]); c.lineWidth = 1.5; c.beginPath();
  for (let k = i0; k <= i1; k++) { const xx = X(D.t[k]), yy = Y(D.entrada[k]); k === i0 ? c.moveTo(xx, yy) : c.lineTo(xx, yy); }
  c.stroke(); c.setLineDash([]);
  c.strokeStyle = "#7fd0ff"; c.lineWidth = 2; c.beginPath();
  for (let k = i0; k <= i1; k++) { const xx = X(D.t[k]), yy = Y(D.suave[k]); k === i0 ? c.moveTo(xx, yy) : c.lineTo(xx, yy); }
  c.stroke(); c.restore();
  texto("señal del detector (últimos 20 s)", gx, gy + gh + 22, 16, "#7f93b8");
  texto("umbral de entrada", gx + gw - 8, gy + gh + 22, 16, "#ff8080", 400, "right");
  // Rótulo fijo
  texto(ROTULO, W / 2, H - 22, 21, "#9aa6bd", 400, "center");
}

// ---------- animación de la escena según t ----------
function actualizar(t, azGrados) {
  if (azGrados !== undefined) ponerCamara(azGrados);
  const i = idx(t), mov = D.mov[i] === 1;
  const brillo = Math.min(1.4, D.suave[i] / Math.max(D.entrada[i], 1e-6)) / 1.4;
  // Baldosas de la línea: intensidad uniforme según la señal (nunca según la persona)
  const base = new THREE.Color(0x0b1a16);
  const linea = mov ? new THREE.Color(0xff3b30) : new THREE.Color(0x1e8cff);
  const fuerza = mov ? 0.45 + 0.55 * brillo : 0.12 + 0.45 * brillo;
  for (let k = 0; k < enLinea.length; k++) {
    baldosas.setColorAt(k, enLinea[k] ? base.clone().lerp(linea, fuerza) : base);
  }
  baldosas.instanceColor.needsUpdate = true;
  haz.material.color.set(mov ? 0xff6b6b : 0x6fa8ff);
  // Cúpulas: se expanden con el tiempo (metáfora visual constante)
  cupulas.forEach((m, k) => {
    const r = 0.35 + ((t * 0.6 + k * 1.1) % 3.3);
    m.scale.setScalar(r); m.material.opacity = 0.42 * (1 - r / 3.65);
  });
  // Figura según el protocolo (caminata del modelo, fijada a t para que cada cuadro sea reproducible)
  const p = persona(t);
  figura.position.set(PASO_X, 0, p.z);
  figura.rotation.y = p.rumbo;
  if (mezclador) {
    accCaminar.time = p.camina !== null ? (p.camina * RITMO) % accCaminar.getClip().duration : 0;
    accQuieto.time = (t * 0.8) % accQuieto.getClip().duration;
    accCaminar.setEffectiveWeight(p.w); accQuieto.setEffectiveWeight(1 - p.w);
    mezclador.update(0);
  }
  moverParticulas(t);
  // Estela: posiciones del protocolo un instante antes; solo se ve mientras la figura se desplaza
  estela.forEach((e, k) => {
    const q = persona(t - (k + 1) * 0.07), dz = Math.abs(q.z - p.z);
    e.position.set(PASO_X, 1.0, q.z); e.material.opacity = dz > 0.015 ? 0.07 * (1 - k / 5) : 0;
  });
  // Foco en la figura y la línea
  const foco = new THREE.Vector3(0, 0.8, p.z * 0.5);
  bokeh.uniforms.focus.value = camara.position.distanceTo(foco);
  compositor.render();
  dibujarHUD(t);
}

function compuesto() {
  const o = document.createElement("canvas"); o.width = W; o.height = H;
  const oc = o.getContext("2d"); oc.drawImage(gl, 0, 0); oc.drawImage(hud, 0, 0);
  return o.toDataURL("image/png");
}
window.listo = cargaFigura;
// Línea de tiempo del video (igual que analisis/video_k002.py): cada cruce a ×1 de t_k − 1,5 a t_k + 3 s; el resto a ×20
function lineaDeTiempo() {
  const FPS = 30, ANTES = 1.5, DESPUES = 3.0, ACEL = 20, FIN = 300, tramos = [];
  let t = 0;
  for (const tc of D.cruces) { tramos.push([t, tc - ANTES, ACEL]); tramos.push([tc - ANTES, tc + DESPUES, 1]); t = tc + DESPUES; }
  tramos.push([t, FIN, ACEL]);
  const cuadros = [];
  for (const [a, b, v] of tramos) { const n = Math.round((b - a) / v * FPS); for (let i = 0; i < n; i++) cuadros.push([a + i * v / FPS, v]); }
  return cuadros;
}
window.lineaDeTiempo = lineaDeTiempo;
window.grabarVideo = async function (nombre) {
  await cargaFigura;
  const cuadros = lineaDeTiempo();
  if (!(await fetch("/video/inicio?nombre=" + encodeURIComponent(nombre) + "&cuadros=" + cuadros.length, { method: "POST" })).ok) {
    document.title = "video error inicio"; return false;
  }
  window.__celPrev = null;
  for (let i = 0; i < cuadros.length; i++) {
    const [t, v] = cuadros[i];
    VELOCIDAD = v;
    actualizar(t, vista.az + 12 * Math.sin(2 * Math.PI * i / cuadros.length));   // órbita lenta de ±12°
    const r = await fetch("/video/cuadro", { method: "POST", body: compuesto() });
    if (!r.ok) { document.title = "video error cuadro " + i; return false; }
    document.title = `video ${i + 1}/${cuadros.length}`;
  }
  const r = await fetch("/video/fin", { method: "POST" });
  document.title = r.ok ? "video listo" : "video error fin";
  return r.ok;
};
window.renderizar = function (t, az) { actualizar(t, az); return true; };
window.guardar = async function (t, nombre, az) {
  await cargaFigura;
  actualizar(t, az);
  const r = await fetch("/guardar?nombre=" + encodeURIComponent(nombre), { method: "POST", body: compuesto() });
  return r.ok;
};

cargaFigura.catch(e => { document.title = "error modelo"; console.error(e); });
if (P.has("video")) {
  window.grabarVideo(P.get("video"));
} else if (T_FIJO !== null) {
  cargaFigura.then(() => {
    actualizar(T_FIJO);
    if (EXPORTAR) window.guardar(T_FIJO, EXPORTAR).then(ok => { document.title = ok ? "guardado" : "error"; });
  });
} else {
  const inicio = performance.now();
  (function bucle() {
    const t = ((performance.now() - inicio) / 1000) % 300;
    actualizar(t, vista.az + 12 * Math.sin(t * 2 * Math.PI / 60));   // órbita lenta (vista previa)
    requestAnimationFrame(bucle);
  })();
}
